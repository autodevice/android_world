<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Android World Debug UI</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .main-panel {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00d4ff;
            margin-bottom: 30px;
            margin-top: 10px;
        }
        .sidebar {
            width: 350px;
            background: #0f0f1a;
            border-left: 2px solid #0f3460;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar h2 {
            color: #00d4ff;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .screenshot-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            flex: 1;
            width: 100%;
            overflow: hidden;
        }
        .screenshot-wrapper {
            position: relative;
            display: inline-block;
        }
        .screenshot-img {
            max-height: calc(100vh - 120px);
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .no-screenshot {
            color: #555;
            font-style: italic;
            margin-top: 50px;
        }
        .directory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .directory-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background: #16213e;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            border: 2px solid transparent;
        }
        .directory-item:hover {
            background: #1a2a4a;
            border-color: #00d4ff;
        }
        .dir-icon {
            font-size: 28px;
            margin-right: 15px;
        }
        .dir-info {
            flex: 1;
        }
        .dir-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .dir-goal {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .dir-mtime {
            font-size: 12px;
            color: #888;
        }
        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status-success {
            background: #2e7d32;
            color: white;
        }
        .status-failure {
            background: #c62828;
            color: white;
        }
        .back-link {
            font-size: 14px;
            color: #888;
            cursor: pointer;
            margin-right: 15px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s, color 0.2s;
        }
        .back-link:hover {
            background: #0f3460;
            color: #00d4ff;
        }
        .planner-step {
            background: #16213e;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            border: 1px solid #0f3460;
        }
        .planner-header {
            display: flex;
            align-items: flex-start;
            padding: 20px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .planner-header:hover {
            background: #1a2a4a;
        }
        .step-number {
            background: #00d4ff;
            color: #1a1a2e;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 8px;
            margin-right: 15px;
            flex-shrink: 0;
        }
        .planner-content {
            flex: 1;
        }
        .planner-query {
            font-size: 16px;
            margin-bottom: 10px;
            line-height: 1.5;
        }
        .planner-thinking {
            font-size: 13px;
            color: #888;
            font-style: italic;
            margin-top: 8px;
        }
        .planner-tools {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tool-badge {
            background: #e94560;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
        }
        .expand-icon {
            margin-left: 10px;
            transition: transform 0.3s;
            color: #00d4ff;
            font-size: 18px;
        }
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        .executor-container {
            display: none;
            background: #0f0f23;
            border-top: 1px solid #0f3460;
            padding: 15px;
        }
        .executor-container.visible {
            display: block;
        }
        .executor-step {
            display: flex;
            align-items: flex-start;
            padding: 15px;
            background: #1a1a2e;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: background 0.2s, border 0.2s;
            position: relative;
            border: 2px solid transparent;
        }
        .executor-step:hover {
            background: #252545;
            border-color: #00d4ff;
        }
        .executor-step.active {
            background: #252545;
            border-color: #00d4ff;
        }
        .exec-step-number {
            background: #e94560;
            color: white;
            font-weight: bold;
            padding: 6px 10px;
            border-radius: 6px;
            margin-right: 12px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .exec-content {
            flex: 1;
        }
        .exec-query {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .exec-thinking {
            font-size: 12px;
            color: #777;
            font-style: italic;
        }
        .exec-tools {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .exec-tool-badge {
            background: #533483;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .no-executor {
            color: #666;
            font-style: italic;
            padding: 10px;
        }
        .timestamp {
            font-size: 11px;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="main-panel">
        <h1>Android World Debug UI</h1>
        <div id="content-area"></div>
    </div>
    <div class="sidebar">
        <h2>Screenshot Preview</h2>
        <div class="screenshot-container">
            <div id="screenshot-area">
                <p class="no-screenshot">Hover over an executor step to see the screenshot</p>
            </div>
        </div>
    </div>

    <script>
        let plannerData = [];
        let executorData = {};
        let activeExecStep = null;
        let currentDir = null;

        async function loadDirectories() {
            try {
                const res = await fetch('/api/directories');
                const directories = await res.json();
                renderDirectoryList(directories);
            } catch (error) {
                console.error('Error loading directories:', error);
                document.getElementById('content-area').innerHTML =
                    '<p style="color: #e94560;">Error loading directories.</p>';
            }
        }

        function renderDirectoryList(directories) {
            const container = document.getElementById('content-area');
            document.querySelector('h1').textContent = 'Android World Debug UI';

            if (directories.length === 0) {
                container.innerHTML = '<p style="color: #888;">No test runs found.</p>';
                return;
            }

            container.innerHTML = `
                <div class="directory-list">
                    ${directories.map(dir => `
                        <div class="directory-item" onclick="openDirectory('${dir.name}')">
                            <span class="dir-icon">📁</span>
                            <div class="dir-info">
                                <div class="dir-name">${escapeHtml(dir.name)}</div>
                                ${dir.goal ? `<div class="dir-goal">${escapeHtml(dir.goal)}</div>` : ''}
                                <div class="dir-mtime">${dir.mtime_display}</div>
                            </div>
                            <span class="status-badge ${dir.success ? 'status-success' : 'status-failure'}">
                                ${dir.success ? '✓' : '✗'}
                            </span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function openDirectory(dirName) {
            currentDir = dirName;
            document.querySelector('h1').innerHTML = `
                <span class="back-link" onclick="goBack()">← Back</span>
                ${escapeHtml(dirName)}
            `;
            await loadData();
        }

        function goBack() {
            currentDir = null;
            loadDirectories();
        }

        async function loadData() {
            try {
                const dirParam = currentDir ? `?dir=${encodeURIComponent(currentDir)}` : '';
                const [plannerRes, executorRes] = await Promise.all([
                    fetch('/api/planner' + dirParam),
                    fetch('/api/executor' + dirParam)
                ]);
                plannerData = await plannerRes.json();
                executorData = await executorRes.json();
                renderPlannerSteps();
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('content-area').innerHTML =
                    '<p style="color: #e94560;">Error loading data.</p>';
            }
        }

        function getExecutorStepsForPlanner(plannerStep) {
            const executorSteps = [];
            if (!plannerStep.tool_calls) return executorSteps;

            for (const toolCall of plannerStep.tool_calls) {
                const toolCallId = toolCall.id;
                for (const sessionKey of Object.keys(executorData)) {
                    const session = executorData[sessionKey];
                    for (const execStep of session) {
                        if (execStep.planner_tool_call_id === toolCallId) {
                            executorSteps.push(execStep);
                        }
                    }
                }
            }
            return executorSteps;
        }

        function renderPlannerSteps() {
            const container = document.getElementById('content-area');
            container.innerHTML = '';

            for (const step of plannerData) {
                const executorSteps = getExecutorStepsForPlanner(step);
                const stepEl = document.createElement('div');
                stepEl.className = 'planner-step';

                const toolBadges = (step.tool_calls || [])
                    .map(tc => `<span class="tool-badge">${tc.function.name}</span>`)
                    .join('');

                stepEl.innerHTML = `
                    <div class="planner-header" onclick="toggleExecutor(${step.step_number})">
                        <span class="step-number">Step ${step.step_number}</span>
                        <div class="planner-content">
                            <div class="planner-query">${escapeHtml(step.user_input || 'No input')}</div>
                            <div class="planner-thinking">${escapeHtml(step.thinking || '')}</div>
                            <div class="planner-tools">${toolBadges}</div>
                            <div class="timestamp">${step.timestamp || ''}</div>
                        </div>
                        <span class="expand-icon" id="expand-${step.step_number}">${executorSteps.length > 0 ? '▼' : ''}</span>
                    </div>
                    <div class="executor-container" id="executor-${step.step_number}">
                        ${renderExecutorSteps(executorSteps, step.step_number, step.screenshot_path)}
                    </div>
                `;
                container.appendChild(stepEl);
            }
        }

        function renderExecutorSteps(executorSteps, plannerStepNum, plannerScreenshot) {
            if (executorSteps.length === 0) {
                return '<div class="no-executor">No executor steps for this planner step</div>';
            }

            return executorSteps.map((step, idx) => {
                const toolBadges = (step.tool_calls || [])
                    .map(tc => `<span class="exec-tool-badge">${tc.function.name}</span>`)
                    .join('');

                const stepId = `exec-${plannerStepNum}-${idx}`;
                let prevScreenshot;
                if (idx === 0) {
                    prevScreenshot = plannerScreenshot;
                } else {
                    prevScreenshot = executorSteps[idx - 1].screenshot_path;
                }

                const stepWithPrevScreenshot = {
                    ...step,
                    display_screenshot: prevScreenshot
                };

                return `
                    <div class="executor-step" id="${stepId}"
                         onmouseenter="showScreenshot(${JSON.stringify(stepWithPrevScreenshot).replace(/"/g, '&quot;')}, '${stepId}')"
                         onclick="showScreenshot(${JSON.stringify(stepWithPrevScreenshot).replace(/"/g, '&quot;')}, '${stepId}')">
                        <span class="exec-step-number">${step.step_number}</span>
                        <div class="exec-content">
                            <div class="exec-query">${escapeHtml(step.query || '')}</div>
                            <div class="exec-thinking">${escapeHtml(step.thinking || '')}</div>
                            <div class="exec-tools">${toolBadges}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showScreenshot(step, stepId) {
            if (activeExecStep) {
                const prevEl = document.getElementById(activeExecStep);
                if (prevEl) prevEl.classList.remove('active');
            }
            activeExecStep = stepId;
            const currEl = document.getElementById(stepId);
            if (currEl) currEl.classList.add('active');

            const screenshotArea = document.getElementById('screenshot-area');
            const screenshotToShow = step.display_screenshot || step.screenshot_path;
            if (!screenshotToShow) {
                screenshotArea.innerHTML = '<p class="no-screenshot">No screenshot available for this step</p>';
                return;
            }

            const dirParam = currentDir ? `?dir=${encodeURIComponent(currentDir)}` : '';
            const screenshotPath = `/screenshots/${screenshotToShow.replace('screenshots/', '')}${dirParam}`;
            screenshotArea.innerHTML = `
                <div class="screenshot-wrapper">
                    <img class="screenshot-img" src="${screenshotPath}" alt="Screenshot">
                </div>
            `;
        }

        function toggleExecutor(stepNumber) {
            const container = document.getElementById(`executor-${stepNumber}`);
            const icon = document.getElementById(`expand-${stepNumber}`);
            container.classList.toggle('visible');
            icon.classList.toggle('expanded');
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadDirectories();
    </script>
</body>
</html>
